<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>dither.studio — turn an image into a looping dither</title>
    <meta
      name="description"
      content="Upload an image, dither it, animate it, export a loop as GIF, video or a sprite sheet. Runs entirely in the browser — nothing is uploaded."
    />
    <meta name="theme-color" content="#140C08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2EDDF" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <meta property="og:title" content="dither.studio" />
    <meta
      property="og:description"
      content="Turn an image into a looping dither animation. Nothing is uploaded."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dither-studio-ayo.vercel.app/" />
    <!-- Absolute, because several scrapers will not resolve a relative image
         against the page they found it on. Generated by scripts/og.mjs — the
         card is dithered by the same rules the tool applies. -->
    <meta property="og:image" content="https://dither-studio-ayo.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="dither.studio — a dithered sphere beside the words 'Turn an image into a looping dither.'" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dither.studio" />
    <meta
      name="twitter:description"
      content="Turn an image into a looping dither animation. Nothing is uploaded."
    />
    <meta name="twitter:image" content="https://dither-studio-ayo.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Two families, three weights between them. A variable-axis download for an
         interface that uses two weights is bytes spent on nothing. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Before paint, not in React. A themed interface that renders once in the
         wrong theme and corrects itself is worse than one with no theme at
         all — the flash is the thing people notice. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dither.theme");
          var system = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = saved || system;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
